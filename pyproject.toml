[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-fight-pattern-analyzer"
version = "0.1.0"
description = "On-device pose-pattern analysis for Snapdragon-powered PCs"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
